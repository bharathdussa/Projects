_schema-version: 3.3.0
ID: Customer_Loyalty
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: Customer_Loyalty-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: Customer_Loyalty-auth
      - name: Customer_Loyalty-db
      - name: Customer_Loyalty-destination

  - name: Customer_Loyalty-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: Customer_Loyalty-db
  - name: Customer_Loyalty
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: Customer_Loyalty-auth
      - name: Customer_Loyalty-html5-runtime
      - name: Customer_Loyalty-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: Customer_Loyalty-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: Customer_Loyaltycustomersui
          artifacts:
            - customersui.zip
          target-path: app/
        - name: Customer_Loyaltypoliciesui
          artifacts:
            - policiesui.zip
          target-path: app/
        - name: Customer_Loyaltyredemptionsui
          artifacts:
            - redemptionsui.zip
          target-path: app/
        - name: Customer_Loyaltytranasactionui
          artifacts:
            - tranasactionui.zip
          target-path: app/
    requires:
      - name: Customer_Loyalty-auth
      - name: srv-api
      - name: Customer_Loyalty-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: Customer_Loyaltycustomersui
    type: html5
    path: app/customersui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: Customer_Loyaltypoliciesui
    type: html5
    path: app/policiesui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: Customer_Loyaltyredemptionsui
    type: html5
    path: app/redemptionsui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: Customer_Loyaltytranasactionui
    type: html5
    path: app/tranasactionui
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: Customer_Loyalty-destinations
    type: com.sap.application.content
    requires:
      - name: Customer_Loyalty-auth
        parameters:
          service-key:
            name: Customer_Loyalty-auth-key
      - name: Customer_Loyalty-html5-repo-host
        parameters:
          service-key:
            name: Customer_Loyalty-html5-repo-host-key
      - name: srv-api
      - name: Customer_Loyalty-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: Customer_Loyalty-html5-repository
              ServiceInstanceName: Customer_Loyalty-html5-repo-host
              ServiceKeyName: Customer_Loyalty-html5-repo-host-key
              sap.cloud.service: Customer_Loyalty.service
            - Name: Customer_Loyalty-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: Customer_Loyalty-auth
              ServiceKeyName: Customer_Loyalty-auth-key
              sap.cloud.service: Customer_Loyalty.service

resources:
  - name: Customer_Loyalty-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: Customer_Loyalty-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'RetailStaff (Customer_Loyalty ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.RetailStaff'
          - name: 'Admin (Customer_Loyalty ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Admin'
          - name: 'Customer (Customer_Loyalty ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Customer'
    requires:
      - name: app-api
  - name: Customer_Loyalty-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: Customer_Loyalty-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
    requires:
      - name: srv-api

  - name: Customer_Loyalty-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: Customer_Loyalty-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
